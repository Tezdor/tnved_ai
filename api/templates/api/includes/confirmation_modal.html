<dialog id="confirmationModal">

    <article>

        <header>

            <h3>
                Всё ли верно?
            </h3>

        </header>


        <div id="confirmationContent">

            <label for="confirmationDescription">
                Описание товара
            </label>

            <textarea
                id="confirmationDescription"
                rows="4"
            ></textarea>


            <label for="confirmationProduct">
                Товар
            </label>

            <input
                type="text"
                id="confirmationProduct"
            >


            <label for="confirmationMaterial">
                Материал
            </label>

            <input
                type="text"
                id="confirmationMaterial"
            >


            <div id="confirmationAnswers">

                <h4>
                    Ответы на уточняющие вопросы
                </h4>

                <div id="confirmationAnswersContainer">
                </div>

            </div>

        </div>


        <footer>

            <button
                id="editConfirmationBtn"
                type="button"
                class="secondary"
            >
                Изменить
            </button>

            <button
                id="confirmAnalysisBtn"
                type="button"
            >
                Подтвердить
            </button>

        </footer>

    </article>

</dialog>
